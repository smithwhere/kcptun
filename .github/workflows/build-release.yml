name: Build Release Binaries

on:
  push:
    tags:
      - '*'
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        include:
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: linux
            goarch: arm
            goarm: 7
          - goos: linux
            goarch: 386
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
          - goos: freebsd
            goarch: amd64

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.24.0'

      - name: Clean vendor and dependencies
        run: |
          rm -rf vendor/
          rm -f go.sum
          go clean -modcache
          go mod tidy
          go mod download

      - name: Build binaries
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          CGO_ENABLED: 0
        run: |
          EXT=""
          SUFFIX="${{ matrix.goarch }}"
          
          if [ ! -z "${{ matrix.goarm }}" ]; then
            SUFFIX="${{ matrix.goarch }}${{ matrix.goarm }}"
          fi
          
          if [ "${{ matrix.goos }}" == "windows" ]; then 
            EXT=".exe"
          fi
          
          echo "Building for ${{ matrix.goos }}/${SUFFIX}..."
          go build -ldflags="-s -w -X main.VERSION=$(date -u +%Y%m%d)" -o client_${{ matrix.goos }}_${SUFFIX}${EXT} ./client
          go build -ldflags="-s -w -X main.VERSION=$(date -u +%Y%m%d)" -o server_${{ matrix.goos }}_${SUFFIX}${EXT} ./server

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goarm }}
          path: |
            client_*
            server_*

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release Assets
        run: |
          mkdir -p release
          cd artifacts
          for dir in binaries-*/; do
            cd "$dir"
            tar -czf "../../release/kcptun-${dir%/}.tar.gz" *
            cd ..
          done
          cd ..
          ls -la release/

      - name: Generate SHA1 checksums
        run: |
          cd release
          sha1sum *.tar.gz > SHA1SUMS
          cat SHA1SUMS

      - name: Upload to Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            release/*.tar.gz
            release/SHA1SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
